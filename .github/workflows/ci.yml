# Runs on every pull request and push to main: backend tests on PostgreSQL, mobile tests and type check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockflow
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests
        run: python -m pytest

  mobile:
    name: Mobile (TypeScript + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
