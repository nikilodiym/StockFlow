# Development. Production: docker-compose.prod.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports: ["5433:5432"]  # 5432 is often taken by another local Postgres
    volumes: ["stockflow_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional: the API itself in a container (locally you can also run it from .venv)
  api:
    build: ./server
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: &api-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://stockflow:stockflow@db:5432/stockflow
      DJANGO_SECRET_KEY: dev-only-insecure-key-change-me-before-any-deployment
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["api"]

  # Hourly "device has not synced for a long time" notifications (manage.py check_devices).
  scheduler:
    build: ./server
    command: ["sh", "-c", "while true; do python manage.py check_devices; sleep 3600; done"]
    environment:
      <<: *api-env
      SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["api"]

volumes:
  stockflow_pg:
